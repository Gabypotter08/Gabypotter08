<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sélection de couleur</title>
    <style type="text/css">
#coul {
  background: rgb(204, 204, 204);
  width: 100px;
  height: 100px;
} /* #coul est un identifient*/
    </style>
</head>
<body id="page">

    <div>
        <h3>Sélectionner la couleur</h3>
        <input type="range" min="0" max="255" value="150" id="rouge"/>
        <input type="range" misn="0" max="255" value="50" id="vert"/>
        <input type="range" min="0" max="255" value="250" id="bleu"/>
        <button id="bou">Application</button>
    </div>

    <form>
        Rouge: <input type="text" name="r" id="r"/>
        <p>
        Vert: <input type="text" name="v" id="v"/>
        </p>
        <p>
        Bleu: <input type="text" name="b" id="b"/>
        </p>
        <p>
        <button id="bouton">Appliquer</button>
        </p>
    </form>
    <div id="coul"></div>

    <script language="javascript" type="text/javascript" src="exopages.js"></script>
<script>
document.getElementById("bouton").onclick = function couleur(){
			let entreeR = document.getElementById("r");
			let r = entreeR.value;
			let entreeV = document.getElementById("v");
			let v = entreeV.value;
			let entreeB = document.getElementById("b");
			let b = entreeB.value;
			document.getElementById("coul").style.background = "rgb(" +r+ "," +v+ "," +b+ ")";
			
			return false;
		}

document.getElementById("bou").onclick = function cou(){
			let entreeR = document.getElementById("rouge");
			let r = entreeR.value;
			let entreeV = document.getElementById("vert");
			let v = entreeV.value;
			let entreeB = document.getElementById("bleu");
			let b = entreeB.value;
			document.getElementById("page").style.background = "rgb(" +r+ "," +v+ "," +b+ ")";
			return false;
		}
    </script>
</body>
</html>
